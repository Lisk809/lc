    <script>
      // 首帧前应用持久化主题，避免暗色模式闪烁（与 uiStore 持久化 key 对应）
      ;(function () {
        try {
          var s = JSON.parse(localStorage.getItem('lunacho-ui') || '{}')
          if (s.isDark) {
            document.documentElement.classList.add('dark')
            // 浏览器导航栏颜色与暗色主题同步（与 uiStore.applyTheme 一致）
            var tc = document.querySelector('meta[name="theme-color"]')
            if (tc) tc.setAttribute('content', '#0e0e11')
          }
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
