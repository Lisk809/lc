<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="description"
      content="Lunatic ChO — 月之都的化学竞赛社区（ChO = 化学奥林匹克 · C·H·O）：帖子讨论、题库管理、文件资源共享、官方公告"
    />
    <title>Lunatic ChO · 月之都化学竞赛社区</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Clicker+Script&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // 首帧前应用持久化主题，避免暗色模式闪烁（与 uiStore 持久化 key 对应）
      ;(function () {
        try {
          var s = JSON.parse(localStorage.getItem('lunacho-ui') || '{}')
          if (s.isDark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
